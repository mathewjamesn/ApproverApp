name: Build TOK Approver APK

on:
  push:
    branches: [main]
    paths:
      - "prototype-app/**"
      - ".github/workflows/build-prototype-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tok-approver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Release signing key. Add these repository secrets to get a stable signature
      # (so new versions install over old ones). Without them the build uses the debug key.
      - name: Restore signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.TOK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.TOK_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TOK_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.TOK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tok.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/tok.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASS" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "No signing secrets set, using the debug key"
          fi

      - name: Build APK
        working-directory: prototype-app
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} -Pvn=1.0.${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp prototype-app/app/build/outputs/apk/release/app-release.apk "dist/TOKApprover-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TOKApprover-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tok-${{ github.run_number }}" dist/*.apk \
            --title "TOK Approver build ${{ github.run_number }}" \
            --notes "TOK Approver for Android. Sign in with your customer-care number. Built from ${{ github.sha }}"

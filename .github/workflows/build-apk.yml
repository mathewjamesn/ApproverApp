name: Build GMT Approver APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "prototype-app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build release APK
        working-directory: android
        # Commits made on Windows don't carry the executable bit, so set it here.
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/GMTApprover-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GMTApprover-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --title "GMT Approver build ${{ github.run_number }}" \
            --notes "Release APK built from ${{ github.sha }}"

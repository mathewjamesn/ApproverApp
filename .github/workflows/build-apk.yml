name: Build Pikme Approver prototype APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build release APK
        working-directory: android
        # Commits made on Windows don't carry the executable bit, so set it here.
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PikmeApproverPrototype-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

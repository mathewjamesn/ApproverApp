plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gmt.approver.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tok.approver'
        minSdk 24
        targetSdk 35
        versionCode (project.findProperty('vc') ?: '1').toString().toInteger()
        versionName (project.findProperty('vn') ?: '1.0')
    }

    signingConfigs {
        // Set by the CI workflow from repository secrets. Without them the build falls back to the debug key.
        if (System.getenv('KEYSTORE_FILE')) {
            upload {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

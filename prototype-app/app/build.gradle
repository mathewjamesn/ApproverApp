plugins {
    id 'com.android.application'
}

def mapsApiKey() {
    def key = System.getenv('MAPS_API_KEY') ?: project.findProperty('MAPS_API_KEY')
    if (!key) {
        def shared = rootProject.file('../android/gradle.properties')
        if (shared.exists()) {
            def props = new Properties()
            shared.withInputStream { props.load(it) }
            key = props.getProperty('MAPS_API_KEY')
        }
    }
    return key ?: ''
}

android {
    namespace 'com.gmt.approver.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tok.approver'
        minSdk 24
        targetSdk 35
        versionCode = (project.findProperty('vc') ?: '1').toString().toInteger()
        versionName = (project.findProperty('vn') ?: '1.0').toString()
        // Google Maps key, shared with the React Native app: MAPS_API_KEY environment variable or Gradle property,
        // otherwise the value committed in ../android/gradle.properties.
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey()]
    }

    signingConfigs {
        // Filled in by the CI workflow from repository secrets. Without them the build uses the debug key.
        if (System.getenv('KEYSTORE_FILE')) {
            create('upload') {
                storeFile = file(System.getenv('KEYSTORE_FILE'))
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS')
                keyPassword = System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = System.getenv('KEYSTORE_FILE') ? signingConfigs.getByName('upload') : signingConfigs.getByName('debug')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

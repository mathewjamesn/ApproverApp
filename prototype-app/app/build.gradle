plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gmt.approver.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gmt.approver.prototype'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Prototype only: signed with the auto-generated debug key so it installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
